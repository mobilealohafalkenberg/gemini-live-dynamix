# VX300S Motor Configuration
# For Direct Dynamixel SDK Control (No ROS2)

motors:
  1:  # Waist
    ID: 1
    Model: "XM430-W350"
    Drive_Mode: 0  # Normal
    Min_Position: 0
    Max_Position: 4095
    Velocity_Limit: 50

  2:  # Shoulder (Primary)
    ID: 2
    Model: "XM540-W270"
    Drive_Mode: 1  # REVERSED
    Min_Position: 800
    Max_Position: 3045
    Velocity_Limit: 50
    Secondary_ID: 3  # Shadow motor

  3:  # Shoulder Shadow
    ID: 3
    Model: "XM540-W270"
    Drive_Mode: 0  # Normal
    Min_Position: 800
    Max_Position: 3045
    Velocity_Limit: 50
    Secondary_ID: 2  # Mirrors motor 2

  4:  # Elbow (Primary)
    ID: 4
    Model: "XM540-W270"
    Drive_Mode: 1  # REVERSED
    Min_Position: 898
    Max_Position: 3094
    Velocity_Limit: 50
    Secondary_ID: 5  # Shadow motor

  5:  # Elbow Shadow
    ID: 5
    Model: "XM540-W270"
    Drive_Mode: 0  # Normal
    Min_Position: 898
    Max_Position: 3094
    Velocity_Limit: 50
    Secondary_ID: 4  # Mirrors motor 4

  6:  # Forearm Roll
    ID: 6
    Model: "XM430-W350"
    Drive_Mode: 0
    Min_Position: 0
    Max_Position: 4095
    Velocity_Limit: 50

  7:  # Wrist Angle
    ID: 7
    Model: "XM430-W350"
    Drive_Mode: 1  # REVERSED
    Min_Position: 830
    Max_Position: 3504
    Velocity_Limit: 50

  8:  # Wrist Rotate
    ID: 8
    Model: "XM430-W350"
    Drive_Mode: 0
    Min_Position: 0
    Max_Position: 4095
    Velocity_Limit: 50

  9:  # Gripper
    ID: 9
    Model: "XM430-W350"
    Drive_Mode: 0
    Min_Position: 0
    Max_Position: 3070
    Velocity_Limit: 131

groups:
  arm:
    motor_ids: [1, 2, 4, 6, 7, 8]  # Primary motors only (shadow motors excluded)

grippers:
  gripper:
    motor: 9
    horn_radius: 0.022  # meters
    arm_length: 0.036   # meters

# Gripper calibration per arm (Dynamixel units)
# These values were measured by manually positioning grippers to their limits
gripper_calibration:
  follower_right:
    open: 3118
    closed: 2490
  follower_left:
    open: 3164
    closed: 2514
  # Default values for unknown arms (average of measured values)
  default:
    open: 3140
    closed: 2500

# Per-arm joint limit calibration (Dynamixel units)
# These values were measured by manually moving joints to their limits
joint_calibration:
  follower_right:
    1:  # Waist
      min: 1490
      max: 2789
    2:  # Shoulder
      min: 937
      max: 2957
    4:  # Elbow
      min: 836
      max: 3081
    6:  # Forearm Roll
      min: 1050
      max: 3106
    7:  # Wrist Angle
      min: 882
      max: 2600  # Extended to allow sleep pose (needs 2569)
    8:  # Wrist Rotate
      min: 1376
      max: 3043
  follower_left:
    1:  # Waist
      min: 1473
      max: 2562
    2:  # Shoulder
      min: 870
      max: 2937
    4:  # Elbow
      min: 1018
      max: 3097
    6:  # Forearm Roll
      min: 1038
      max: 3070
    7:  # Wrist Angle
      min: 854
      max: 2600  # Extended to allow sleep pose (needs 2569)
    8:  # Wrist Rotate
      min: 1092
      max: 3071

# Named poses (in radians for joints 1-6)
poses:
  home: [0.0, -0.3, 0.6, 0.0, -0.3, 0.0]
  sleep: [0.0, -1.69, 1.55, 0.0, 0.8, 0.0]
  ready: [0.0, -0.96, 1.16, 0.0, -0.3, 0.0]

# Camera serial number to name mapping
cameras:
  "130322270224": "right_gripper"
  "130322273632": "left_gripper"
  "130322273629": "overhead_camera"
